# Sweep determinism test: the phase-8 A/B pair on a small flat world.
#
# Derived from compose-det.yml, same pinned image, same 2 GB heap, same flags.
# Two differences, both deliberate:
#   * container names mc-sweep-A/B and data dirs dataSweepA/B, so a sweep run and
#     a compose-det.yml run (mc-det-A/B, dataA/B) can never collide -- the phase 7
#     chains and the hunt fleet are long-lived and share this host.
#   * LEVEL_TYPE=minecraft:flat. The sweep world is built by commands, not found in
#     terrain: a flat world generates in seconds, holds no natural structures and no
#     surprise entities, so the only things in the digest are the ones the case
#     script put there.
# One service is started at a time (see sweep-pair.sh); the pair is never up at once.
x-mc: &mc
  image: itzg/minecraft-server:latest@sha256:c1a267d9ed6de3d1157859753a002aa35f8366d8db00463df3d6b07e86d2bf1d  # pinned 2026-09-10
  restart: "no"
  logging:
    driver: json-file
    options:
      max-size: "2g"
      max-file: "1"
  tty: true
  stdin_open: true
  environment:
    - EULA=TRUE
    - TYPE=FABRIC
    - VERSION=26.2
    - FABRIC_LOADER_VERSION=0.19.5
    # Every world setting comes from the case's `world:` block via sweep-case.py,
    # so case.yaml is the single source of truth and this file is only the image
    # pin, the log driver and the mount layout.
    - SEED=${SWEEP_SEED:-12345}
    - LEVEL_TYPE=${SWEEP_LEVEL_TYPE:-minecraft:flat}
    - ONLINE_MODE=FALSE
    - ENABLE_RCON=TRUE
    - RCON_PASSWORD=${RCON_PASSWORD}
    - VIEW_DISTANCE=${SWEEP_VIEW:-4}
    - SIMULATION_DISTANCE=${SWEEP_SIM:-4}
    - SPAWN_MONSTERS=true
    - SPAWN_PROTECTION=0
    - MEMORY=${SWEEP_MEMORY:-2G}
    - USE_AIKAR_FLAGS=false
    - PAUSE_WHEN_EMPTY_SECONDS=-1
    - MAX_TICK_TIME=-1
    - JVM_OPTS=-Ddetmc.seed=${DETMC_SEED:-1} -Ddetmc.freezeOnStart=true -Dmax.bg.threads=1 ${DETMC_EXTRA_OPTS:-}
services:
  mcA:
    <<: *mc
    container_name: mc-sweep-A
    volumes:
      - ./dataSweepA:/data
      - ./sweep-mods:/data/mods
  mcB:
    <<: *mc
    container_name: mc-sweep-B
    volumes:
      - ./dataSweepB:/data
      - ./sweep-mods:/data/mods
