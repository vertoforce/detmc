# Determinism test: one service per run, separate data dirs, same world seed,
# same detmc seed.
x-mc: &mc
  image: itzg/minecraft-server:latest@sha256:c1a267d9ed6de3d1157859753a002aa35f8366d8db00463df3d6b07e86d2bf1d  # pinned 2026-09-10
  restart: "no"
  # Phase 7: the daemon default (json-file, 10m x 3) rotated the startup part of the log away
  # under -Ddetmc.traceIo, so the [detmc-ec]/[detmc-ea] startup traces were lost. Keep it all.
  logging:
    driver: json-file
    options:
      max-size: "2g"
      max-file: "1"
  tty: true
  stdin_open: true
  environment:
    - EULA=TRUE
    - TYPE=FABRIC
    - VERSION=26.2
    - FABRIC_LOADER_VERSION=0.19.5
    - SEED=12345
    - ONLINE_MODE=FALSE
    - ENABLE_RCON=TRUE
    - RCON_PASSWORD=${RCON_PASSWORD}
    - VIEW_DISTANCE=4
    - SIMULATION_DISTANCE=4
    - SPAWN_MONSTERS=true
    - SPAWN_PROTECTION=0
    - MEMORY=4G
    - USE_AIKAR_FLAGS=false
    - PAUSE_WHEN_EMPTY_SECONDS=-1
    # The tick-end chunk-task drain collapses a whole forceload into one tick.
    # The default 60 s watchdog would kill the server mid-generation.
    - MAX_TICK_TIME=-1
    - JVM_OPTS=-Ddetmc.seed=1 -Ddetmc.freezeOnStart=true -Dmax.bg.threads=1 ${DETMC_EXTRA_OPTS:-}
services:
  mcA:
    <<: *mc
    container_name: mc-xm-A
    volumes:
      - ./dataA:/data
      - ./mods:/data/mods
  mcB:
    <<: *mc
    container_name: mc-det-hostB
    volumes:
      - ./dataB:/data
      - ./mods:/data/mods
