# Throwaway vanilla server used by prefilter.py --method locate and for
# verifying cubiomes predictions on the real target version.
# Started/stopped by prefilter.py; MC_SEED must be set.
services:
  mc:
    image: itzg/minecraft-server:java25@sha256:c1a267d9ed6de3d1157859753a002aa35f8366d8db00463df3d6b07e86d2bf1d
    container_name: mc-run-prefilter-locate
    environment:
      EULA: "TRUE"
      VERSION: "${MC_VERSION:-26.2}"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "TRUE"
      MAX_TICK_TIME: "-1"
      PAUSE_WHEN_EMPTY_SECONDS: "-1"
      MEMORY: "2G"
      SEED: "${MC_SEED:-0}"   # prefilter.py always sets this; default keeps `compose down` working
      LEVEL_TYPE: "minecraft:normal"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
