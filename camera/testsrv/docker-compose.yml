# Throwaway 26.2 server used only to produce a world for the camera harness.
services:
  mc:
    image: itzg/minecraft-server:latest@sha256:c1a267d9ed6de3d1157859753a002aa35f8366d8db00463df3d6b07e86d2bf1d  # pinned 2026-09-10
    container_name: mc-camera-test
    restart: "no"
    tty: true
    stdin_open: true
    environment:
      - EULA=TRUE
      - TYPE=FABRIC
      - VERSION=26.2
      - FABRIC_LOADER_VERSION=0.19.5
      - SEED=12345
      - ONLINE_MODE=FALSE
      - ENABLE_RCON=TRUE
      - RCON_PASSWORD=${RCON_PASSWORD}
      - VIEW_DISTANCE=8
      - SIMULATION_DISTANCE=8
      - SPAWN_MONSTERS=true
      - SPAWN_PROTECTION=0
      - MEMORY=4G
      - USE_AIKAR_FLAGS=false
      - PAUSE_WHEN_EMPTY_SECONDS=-1
      - MAX_TICK_TIME=-1
    volumes:
      - ./data:/data
