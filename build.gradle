// Minecraft 26.2 ships a Mojang-named (deobfuscated) server jar and publishes no
// *_mappings artifact, so there is no namespace to remap between. Fabric Loom
// 1.17.20 and 1.18.0-alpha.21 both refuse to configure this version
// ("Failed to find official mojang mappings for 26.2"), so this build compiles
// straight against the shipped server jar. See README.md.
plugins {
    id 'java'
}

subprojects {
    apply plugin: 'java'

    group = project.maven_group
    version = project.mod_version

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version)) }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = Integer.parseInt(project.java_version)
    }

    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
}

ext.minecraftClasspath = { Project p ->
    p.files(rootProject.file("libs/minecraft-server-${p.minecraft_version}.jar")) +
            p.fileTree(dir: rootProject.file('libs/mc-libs'), include: '**/*.jar')
}
